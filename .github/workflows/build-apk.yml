name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npm run cap:add:android
          fi

      - name: Sync Capacitor
        run: npm run cap:sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxi-fare-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release with APK
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          release_name: Taxi Fare APK v${{ github.run_number }}
          body: |
            # Taxi Fare - Android APK
            
            **Build Date**: ${{ github.event.head_commit.timestamp }}
            **Professional Driver Analytics App**
            
            ## 📲 Installation Instructions
            
            1. Download the APK file below
            2. Transfer to your Android phone
            3. Open file manager and tap the APK file
            4. Tap "Install" (enable "Unknown Sources" if prompted)
            5. App opens - ready to use! 🎉
            
            ## ✨ Features
            - ✅ Trip logging with 10+ metrics
            - ✅ Expense tracking (8 categories)
            - ✅ Advanced reporting & analytics
            - ✅ CSV export to Excel
            - ✅ Dark mode support
            - ✅ Full offline support
            - ✅ Professional dashboard
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
