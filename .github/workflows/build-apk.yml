name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm install

    - name: Build Web Assets
      run: |
        mkdir -p www
        # Copy existing www files if they exist
        if [ -f index.html ]; then cp index.html www/; fi
        if [ -f manifest.json ]; then cp manifest.json www/; fi
        if [ -f service-worker.js ]; then cp service-worker.js www/; fi

    - name: Initialize Capacitor Android
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap add android --web-dir=www

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: taxi-fare-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Display Build Info
      run: |
        echo "✅ Build completed successfully!"
        echo "📱 APK: app-debug.apk"
        ls -lh android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo "APK output path may vary"
